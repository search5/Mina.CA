<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Online CA(Certificate Associate) - Material Design 3">
  <meta name="author" content="Lee Persy Ji-Ho">
  <title>Mina.CA - Online CA</title>
  <!-- Material Design 3 Stylesheet -->
  <link href="{{ url_for('static', filename='css/material3.css') }}" rel="stylesheet">
  {% block js %}
  {% endblock %}
</head>
<body>

<div class="m3-layout">
  <!-- M3 Navigation Drawer (Sidebar) -->
  <aside class="m3-navigation-drawer">
    <div class="m3-drawer-header">
      <a href="/" class="m3-drawer-title" style="text-decoration: none;">
        <span class="material-symbols-outlined" style="font-size: 32px; color: var(--md-sys-color-primary);">shield</span>
        Mina.CA
      </a>
    </div>
    
    <ul class="m3-drawer-menu">
      {% block left_menu %}
        <li class="m3-drawer-item {{ 'active' if request.endpoint == 'ca_list' or request.endpoint == 'ca_add' else '' }}">
          <a href="/">
            <span class="material-symbols-outlined">account_balance</span>
            인증기관(CA) 관리
          </a>
        </li>
        <li class="m3-drawer-item {{ 'active' if request.endpoint == 'csr_pending_list' else '' }}">
          <a href="{{ url_for('csr_pending_list') }}">
            <span class="material-symbols-outlined">pending_actions</span>
            CSR 대기 목록
          </a>
        </li>
      {% endblock %}
    </ul>
    
    <div class="m3-drawer-footer">
      <img src="https://github.com/mdo.png" alt="User Avatar" class="m3-user-avatar">
      <div class="m3-user-info">
        <span class="m3-user-name">관리자</span>
        <span class="m3-user-email">admin@mina.ca</span>
      </div>
    </div>
  </aside>

  <!-- Main Work Content Area -->
  <main class="m3-main-container">
    {% block main %}
      <h1 class="m3-page-title">Mina.CA</h1>
      <p class="m3-page-subtitle">Web Based Openssl Certificate Authority Manager</p>
    {% endblock %}
  </main>
</div>

{% block footer_js %}
{% endblock %}
</body>
</html>
